name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include browser and environment, without credentials or subscriber data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
